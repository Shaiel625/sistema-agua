name: Build APK

# Se ejecuta cada vez que subes cambios a main, o manualmente desde la pestaña Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Compilar el APK (release)
        run: flutter build apk --release

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30